name: Cleanup merged branches (temporaire)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-merged:
    runs-on: ubuntu-latest
    steps:
      - name: Supprimer les branches fusionnées
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          BRANCHES="
          chore/capex-requests-baseline
          feat/parametres-b1
          feat/parametres-b1-consommateurs
          feat/analytique-a1
          claude/beautiful-joliot-0a877e
          claude/capex-car-header
          feat/cockpit-budget-variance
          feat/kanban-drag-drop
          feat/landing-modules-update
          feat/waterfall-monthly
          fix/brand-no-uppercase
          refonte/opex-capex-l1
          refonte/opex-capex-l3
          refonte/opex-capex-reporting
          "
          for b in $BRANCHES; do
            [ -z "$b" ] && continue
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${b}" >/dev/null 2>&1; then
              echo "supprimée : $b"
            else
              echo "ignorée (absente ?) : $b"
            fi
          done
