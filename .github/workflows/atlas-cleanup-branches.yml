name: Cleanup merged branches (temporaire)

on:
  push:
    branches: [master]
    paths: ['.github/workflows/atlas-cleanup-branches.yml']

permissions:
  contents: write

jobs:
  delete-merged:
    runs-on: ubuntu-latest
    steps:
      - name: Supprimer la branche archivée
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          for b in fix/tenant-race-empty-data; do
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${b}" >/dev/null 2>&1; then
              echo "supprimée : $b"
            else
              echo "ignorée (absente ?) : $b"
            fi
          done
